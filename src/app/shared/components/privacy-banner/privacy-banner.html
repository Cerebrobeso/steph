@if (showPrivacyBanner()) {
  <section class="fixed left-4 bottom-4 w-[450px]" hlmCard>
    <div hlmCardHeader>
      <h3 hlmCardTitle>{{'privacy-banner.title' | translate}}</h3>
      <p hlmCardDescription>{{'privacy-banner.desc' | translate}} <a class="underline" [href]="language() === 'it' ? '/privacy-policy-it' : '/privacy-policy-en'" target="_blank">privacy policy</a></p>
      <div hlmCardAction>
        <button (click)="hidePrivacyBanner()" class="w-full" hlmBtn size="sm" variant="outline">
          {{'misc.close'|translate}}
        </button>
      </div>
    </div>
  </section>
}
